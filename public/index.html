<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumina Library | Makhanda Community Library System</title>
  <meta name="description" content="Lumina Library Resource and Member Management System for the Makhanda community.">
  <meta name="theme-color" content="#0f6766">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6766'/%3E%3Cpath d='M16 6a6 6 0 0 0-3.5 10.9V20h7v-3.1A6 6 0 0 0 16 6zm-2.5 16h5v2h-5z' fill='%23fbbf24'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Small additions that are not Tailwind utilities. */
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f8fafc; color: #1e293b; }
    [x-cloak], .hidden-until-ready { display: none; }
    mark { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }
    @keyframes lumina-pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
    .skeleton { animation: lumina-pulse 1.4s ease-in-out infinite; background: #e2e8f0; border-radius: 6px; }
    @keyframes lumina-pop { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
    .pop-in { animation: lumina-pop .18s ease-out; }
    @media (prefers-reduced-motion: reduce) { .skeleton, .pop-in { animation: none; } * { scroll-behavior: auto !important; transition: none !important; } }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      main { padding: 0 !important; margin: 0 !important; }
      .print-card { box-shadow: none !important; border: 1px solid #cbd5e1 !important; break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-[100] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-brand-700 focus:shadow-lg">Skip to main content</a>

  <div id="app" aria-busy="true">
    <p style="padding:2rem;text-align:center;color:#64748b">Loading Lumina Library&hellip;</p>
  </div>

  <!-- Toast notifications: polite for success/info, assertive alerts are announced individually -->
  <div id="toasts" class="no-print pointer-events-none fixed bottom-3 right-3 z-[90] flex w-[calc(100%-1.5rem)] max-w-sm flex-col gap-2" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <noscript><p style="padding:2rem;text-align:center">Lumina Library needs JavaScript enabled to run.</p></noscript>
  <script type="module" src="/boot.js"></script>
</body>
</html>
